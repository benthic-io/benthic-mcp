name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned rather than `ubuntu-latest` so the 2026-10-19 migration to Ubuntu 26 does not change the
    # image out from under a green build, and bumped off the Node 20 runtime the runner deprecates.
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 so the attribution guard sees real history. The default shallow clone gives
      # it one commit, which would make the check pass without having looked at anything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-uv publishes moving major tags only through v7 and full versions after, so the latest
      # node24 runtime is pinned by full version rather than by a v10 tag that does not resolve.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # --frozen so CI fails on a lockfile that does not match pyproject.toml, rather than
      # silently resolving something nobody reviewed.
      - name: Install
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      # The non-live marker excludes the tests that need a real BDP endpoint and a running
      # llama-server. They are marked rather than skipped by path so the same selection the
      # developer runs locally is the one CI runs.
      - name: Tests
        run: uv run pytest -m "not live" -q

      # Not a test, because it reads git history rather than the tree. Commit 67615fa carried an
      # AI co-author trailer, was force-pushed 67 seconds later, and GitHub still serves it and
      # still counts a second contributor on the repository - the rewrite removed the commit from
      # every ref and left the attribution intact.
      - name: No AI attribution trailers
        run: uv run python scripts/check_attribution.py
